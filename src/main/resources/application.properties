spring.application.name=GlobalHousing
spring.config.import=optional:file:./.env[.properties]

# --- Configuración Base de Datos (Oracle) ---
# En el VPS usa 'oracle21c'; para conectar desde tu equipo local usa '188.245.24.168'
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle21c:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:JOELADMIN}
spring.datasource.password=${DB_PASSWORD:Meseintoseguro1}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# --- Configuración JPA / Hibernate ---
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# --- OAuth2 Google ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# --- Propiedades Personalizadas (JWT & Frontend) ---
app.jwt.secret=${JWT_SECRET:clave_secreta_super_segura_de_al_menos_32_caracteres_longitud_minima}
app.jwt.expiration-ms=3600000
app.frontend.url=${FRONTEND_URL:http://localhost:4200/auth/success}